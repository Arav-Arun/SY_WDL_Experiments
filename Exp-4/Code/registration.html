<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - KisanSaathi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/validation.css">
</head>
<body>

    <header>
        <h1>KisanSaathi</h1>
        <p>Smart Irrigation using AI &amp; Sensor Technology</p>
    </header>

    <div class="page-wrapper">
        <aside class="sidebar">
            <h3>Navigation</h3>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="farm-info.html">Farm Info</a></li>
                <li><a href="advisory.html">Advisory</a></li>
                <li><a href="irrigation-table.html">Dashboard</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="plot-map.html">Plot Map</a></li>
                <li><a href="weather.html">Weather</a></li>
                <li><a href="registration.html">Register</a></li>
            </ul>
        </aside>

        <div class="main-content">
            <section>
                <h2>Farmer Registration Form</h2>

                <form action="#" method="post" enctype="multipart/form-data"
                      name="regForm" id="regForm"
                      onsubmit="return validateForm()" novalidate>

                    <table style="width:100%; border:none; box-shadow:none;">
                        <tr>
                            <td style="width:50%; vertical-align:top;
                                       border:none; padding:0 0.5rem 0 0;">
                                <!-- Personal Information -->
                                <fieldset>
                                    <legend>Personal Information</legend>

                                    <label for="name">Full Name:</label><br>
                                    <input type="text" id="name" name="name"
                                           placeholder="Enter your full name" autofocus>
                                    <span class="error" id="errName"></span><br>

                                    <label for="mobile">Mobile Number:</label><br>
                                    <input type="tel" id="mobile" name="mobile"
                                           placeholder="10-digit mobile number">
                                    <span class="error" id="errMobile"></span><br>

                                    <label for="email">Email Address:</label><br>
                                    <input type="email" id="email" name="email"
                                           placeholder="example@email.com">
                                    <span class="error" id="errEmail"></span><br>

                                    <label for="village">Village:</label><br>
                                    <input type="text" id="village" name="village"
                                           placeholder="Enter village name">
                                    <span class="error" id="errVillage"></span><br>
                                </fieldset>
                            </td>
                            <td style="width:50%; vertical-align:top;
                                       border:none; padding:0 0 0 0.5rem;">
                                <!-- Farm Details -->
                                <fieldset>
                                    <legend>Farm Details</legend>

                                    <label for="plotid">Plot ID:</label><br>
                                    <input type="text" id="plotid" name="plotid"
                                           placeholder="e.g. PLOT-A">
                                    <span class="error" id="errPlot"></span><br>

                                    <label for="cropstage">Crop Stage:</label><br>
                                    <select id="cropstage" name="cropstage">
                                        <option value="" disabled selected>
                                            -- Select Crop Stage --</option>
                                        <option value="germination">Germination</option>
                                        <option value="tillering">Tillering</option>
                                        <option value="grand-growth">Grand Growth</option>
                                        <option value="maturity">Maturity</option>
                                    </select>
                                    <span class="error" id="errCrop"></span><br>

                                    <label for="soiltype">Soil Type:</label><br>
                                    <select id="soiltype" name="soiltype">
                                        <option value="" disabled selected>
                                            -- Select Soil Type --</option>
                                        <option value="black-cotton">Black Cotton</option>
                                        <option value="red-laterite">Red Laterite</option>
                                        <option value="alluvial">Alluvial Soil</option>
                                        <option value="sandy">Sandy Soil</option>
                                        <option value="clay">Clay Soil</option>
                                    </select>
                                    <span class="error" id="errSoil"></span><br>

                                    <label for="moisture">Soil Moisture (%):</label><br>
                                    <input type="text" id="moisture" name="moisture"
                                           placeholder="0 to 100">
                                    <span class="error" id="errMoisture"></span><br>

                                    <label>Irrigation Method:</label><br>
                                    <input type="radio" id="drip" name="irrigation"
                                           value="drip">
                                    <label for="drip">Drip Irrigation</label><br>
                                    <input type="radio" id="furrow" name="irrigation"
                                           value="furrow">
                                    <label for="furrow">Furrow Irrigation</label><br>
                                    <input type="radio" id="sprinkler" name="irrigation"
                                           value="sprinkler">
                                    <label for="sprinkler">Sprinkler Irrigation</label><br>
                                    <input type="radio" id="flood" name="irrigation"
                                           value="flood">
                                    <label for="flood">Flood Irrigation</label>
                                    <span class="error" id="errMethod"></span><br>

                                    <label for="date">Registration Date:</label><br>
                                    <input type="date" id="date" name="date">
                                    <span class="error" id="errDate"></span><br>

                                    <label for="photo">Upload Farm Photo:</label><br>
                                    <input type="file" id="photo" name="photo"
                                           accept="image/*"><br><br>
                                </fieldset>
                            </td>
                        </tr>
                    </table>

                    <div style="text-align:center; margin-top:1rem;">
                        <input type="submit" value="Register">
                        <input type="reset" value="Clear Form" onclick="clearErrors()">
                    </div>

                    <p id="formMessage"></p>

                </form>
            </section>
        </div>
    </div>

    <footer>
        <p>WDL Experiment 4 | SY COMPS Sem 3 | A1 Batch</p>
    </footer>

    <script src="js/validation.js"></script>

</body>
</html>
